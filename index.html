<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live NFL Play-by-Play Stream</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <div class="title-group">
          <h1>NFL Live Play-by-Play</h1>
          <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span id="engine-status">Listening for live plays...</span>
          </div>
        </div>
        <div class="controls">
          <span class="timer-pill" id="poll-timer">Next: 10s</span>
          <button id="refresh-btn">Refresh Now</button>
        </div>
      </header>

      <div class="active-games-summary" id="games-bar"></div>

      <main id="play-feed">
        <div class="empty-state">Loading active games and play-by-play data...</div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
