<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live NFL Play-by-Play Stream</title>
    <style>
      :root {
        --bg-primary: #0b0f19;
        --bg-surface: #141c2e;
        --bg-card: #1c2740;
        --border-color: #2b3956;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --td-color: #22c55e;
        --turnover-color: #ef4444;
        --fg-color: #eab308;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-main);
        padding: 1.5rem 1rem;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 860px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      /* Header & Controls */
      header {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title-group h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.4;
          transform: scale(0.85);
        }
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      button {
        background: var(--accent);
        color: #041226;
        border: none;
        padding: 0.55rem 1rem;
        font-weight: 600;
        font-size: 0.85rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      button:hover {
        background: #7dd3fc;
      }

      .timer-pill {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 0.45rem 0.75rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-family: monospace;
        color: var(--text-muted);
      }

      /* Active Games Bar */
      .active-games-summary {
        display: flex;
        gap: 0.75rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        scrollbar-width: thin;
      }

      .game-badge {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .game-badge .status {
        font-size: 0.7rem;
        background: var(--bg-card);
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        color: var(--accent);
      }

      /* Feed Container */
      #play-feed {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      /* Play Card */
      .play-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition:
          transform 0.1s ease,
          border-color 0.2s ease;
      }

      .play-card.new-play {
        animation: highlight 1.5s ease-out;
      }

      @keyframes highlight {
        0% {
          border-color: var(--accent);
          background: #1e3a5f;
        }

        100% {
          border-color: var(--border-color);
          background: var(--bg-surface);
        }
      }

      .play-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .matchup-tag {
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .game-situation {
        color: var(--text-muted);
        font-family: monospace;
        font-size: 0.78rem;
      }

      .play-body {
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--text-main);
      }

      .play-footer {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.2rem;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        padding: 0.2rem 0.45rem;
        border-radius: 4px;
      }

      .badge-td {
        background: rgba(34, 197, 94, 0.2);
        color: var(--td-color);
      }

      .badge-turnover {
        background: rgba(239, 68, 68, 0.2);
        color: var(--turnover-color);
      }

      .badge-fg {
        background: rgba(234, 179, 8, 0.2);
        color: var(--fg-color);
      }

      .badge-play {
        background: rgba(148, 163, 184, 0.15);
        color: var(--text-muted);
      }

      .yard-stat {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        background: var(--bg-surface);
        border-radius: 10px;
        border: 1px dashed var(--border-color);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="title-group">
          <h1>NFL Live Play-by-Play</h1>
          <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span id="engine-status">Listening for live plays...</span>
          </div>
        </div>
        <div class="controls">
          <span class="timer-pill" id="poll-timer">Next: 10s</span>
          <button id="refresh-btn" onclick="fetchLivePlays()">Refresh Now</button>
        </div>
      </header>

      <div class="active-games-summary" id="games-bar"></div>

      <main id="play-feed">
        <div class="empty-state">Loading active games and play-by-play data...</div>
      </main>
    </div>

    <script>
      const POLL_INTERVAL_SEC = 30;
      let countdown = POLL_INTERVAL_SEC;
      let timerInterval = null;
      const knownPlayIds = new Set();

      /**
       * Identifies kickoffs and punts via play text and ESPN play-type attributes.
       */
      function isKickoffOrPunt(play) {
        const text = (play.text || '').toLowerCase();
        const playType = (play.type?.text || '').toLowerCase();

        // Check textual markers
        if (
          text.includes('kicks off') ||
          text.includes('kickoff') ||
          text.includes('onside kick') ||
          text.includes('punts for') ||
          text.includes('punt') ||
          text.includes('end quarter')
        ) {
          // Exclude fake punts or accidental false positives if needed
          return true;
        }

        // Check structured ESPN play type label
        if (playType.includes('punt') || playType.includes('kickoff')) {
          return true;
        }

        return false;
      }

      /**
       * Assigns an approximate chronological epoch to plays based on quarter and clock
       * so plays across multiple games can be merged descending.
       */
      function calculateChronologicalWeight(play, gameStatus) {
        // If a wall-clock timestamp is present on the play, use it
        if (play.wallclock) {
          return new Date(play.wallclock).getTime();
        }

        // Fallback: Estimate order from Period + Clock (assuming game started recently)
        const period = play.period?.number || 1;
        const clockSeconds = parseClockToSeconds(play.clock?.displayValue || '00:00');

        // Quarter countdown: higher quarters = later in game; lower clock seconds = later in quarter
        const elapsedSeconds = (period - 1) * 15 * 60 + (15 * 60 - clockSeconds);
        return elapsedSeconds;
      }

      function parseClockToSeconds(clockStr) {
        const parts = clockStr.split(':').map(Number);
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        return 0;
      }

      /**
       * Main fetch loop: Pulls scoreboard, queries play summary for each match in parallel,
       * merges, filters, and displays descending.
       */
      async function fetchLivePlays() {
        countdown = POLL_INTERVAL_SEC;
        const statusText = document.getElementById('engine-status');
        statusText.innerText = 'Syncing live plays...';

        try {
          // 1. Fetch current scoreboard
          const scoreRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
          const scoreData = await scoreRes.json();
          const events = scoreData.events || [];

          if (!events.length) {
            document.getElementById('play-feed').innerHTML = `
          <div class="empty-state">No NFL games found on the scoreboard today.</div>
        `;
            statusText.innerText = 'Idle';
            return;
          }

          // 2. Identify in-progress games (or include recent/all if none are actively live)
          let activeGames = events.filter((e) => e.status?.type?.state === 'in');
          if (activeGames.length === 0) {
            // If no games are currently live, use the most recent games to display data
            activeGames = events.slice(0, 4);
          }

          renderGamesBar(events);

          // 3. Parallel fetch play summaries for each game
          const summaryPromises = activeGames.map(async (game) => {
            try {
              const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${game.id}`);
              const data = await res.json();
              return { game, data };
            } catch (err) {
              console.error(`Failed to fetch game summary for ${game.id}:`, err);
              return null;
            }
          });

          const summaries = (await Promise.all(summaryPromises)).filter(Boolean);

          // 4. Flatten all plays, filter out kickoffs & punts, add game metadata
          const allFilteredPlays = [];

          summaries.forEach(({ game, data }) => {
            const homeTeam = game.competitions?.[0]?.competitors?.find((c) => c.homeAway === 'home');
            const awayTeam = game.competitions?.[0]?.competitors?.find((c) => c.homeAway === 'away');
            const matchupStr = `${awayTeam?.team?.abbreviation || 'AWAY'} @ ${homeTeam?.team?.abbreviation || 'HOME'}`;
            const scoreStr = `${awayTeam?.team?.abbreviation} ${awayTeam?.score || 0} - ${homeTeam?.score || 0} ${homeTeam?.team?.abbreviation}`;

            const drives = data.drives?.previous || [];
            if (data.drives?.current) {
              drives.push(data.drives.current);
            }

            drives.forEach((drive) => {
              (drive.plays || []).forEach((play) => {
                // Apply exclusion filter for punts and kickoffs
                if (isKickoffOrPunt(play)) {
                  return;
                }

                allFilteredPlays.push({
                  id: play.id || `${game.id}-${play.sequenceNumber || Math.random()}`,
                  text: play.text,
                  downDistanceText: play.downDistanceText || '',
                  period: play.period?.number || 1,
                  clock: play.clock?.displayValue || '',
                  statYardage: play.statYardage || 0,
                  type: play.type?.text || 'Play',
                  matchup: matchupStr,
                  score: scoreStr,
                  chronologicalWeight: calculateChronologicalWeight(play, game.status),
                  isScoring: play.scoringPlay || false,
                });
              });
            });
          });

          // 5. Order descending (newest play at index 0)
          allFilteredPlays.sort((a, b) => b.chronologicalWeight - a.chronologicalWeight);

          renderFeed(allFilteredPlays);
          statusText.innerText = `Active • ${activeGames.length} game(s) tracked`;
        } catch (err) {
          console.error('Error updating plays:', err);
          statusText.innerText = 'Error syncing feeds';
        }
      }

      function renderGamesBar(events) {
        const bar = document.getElementById('games-bar');
        bar.innerHTML = events
          .map((ev) => {
            const comp = ev.competitions?.[0];
            const away = comp?.competitors?.find((c) => c.homeAway === 'away');
            const home = comp?.competitors?.find((c) => c.homeAway === 'home');
            const status = ev.status?.type?.shortDetail || 'Scheduled';

            return `
        <div class="game-badge">
          <span><strong>${away?.team?.abbreviation}</strong> ${away?.score || 0} - ${home?.score || 0} <strong>${home?.team?.abbreviation}</strong></span>
          <span class="status">${status}</span>
        </div>
      `;
          })
          .join('');
      }

      function renderFeed(plays) {
        const feed = document.getElementById('play-feed');

        if (plays.length === 0) {
          feed.innerHTML = `<div class="empty-state">No non-special teams plays logged yet.</div>`;
          return;
        }

        // Remove consecutive duplicate plays (same text/matchup/clock reported twice in a row)
        const dedupedPlays = plays.filter((play, index) => {
          if (index === 0) return true;
          const prev = plays[index - 1];
          return !(
            play.text === prev.text &&
            play.matchup === prev.matchup &&
            play.period === prev.period &&
            play.clock === prev.clock
          );
        });

        // Limit to latest 75 plays for fast rendering
        const recentPlays = dedupedPlays.slice(0, 75);

        feed.innerHTML = recentPlays
          .map((play) => {
            const isNew = !knownPlayIds.has(play.id);
            knownPlayIds.add(play.id);

            // Detect highlight badge
            let badgeHtml = `<span class="badge badge-play">${play.type}</span>`;
            const txt = play.text.toLowerCase();
            if (txt.includes('touchdown')) {
              badgeHtml = `<span class="badge badge-td">TOUCHDOWN</span>`;
            } else if (txt.includes('intercepted') || txt.includes('fumble recovered')) {
              badgeHtml = `<span class="badge badge-turnover">TURNOVER</span>`;
            } else if (txt.includes('field goal is good')) {
              badgeHtml = `<span class="badge badge-fg">FIELD GOAL</span>`;
            }

            return `
        <article class="play-card ${isNew ? 'new-play' : ''}">
          <div class="play-header">
            <span class="matchup-tag">${play.matchup} (${play.score})</span>
            <span class="game-situation">Q${play.period} ${play.clock} • ${play.downDistanceText}</span>
          </div>
          <p class="play-body">${play.text}</p>
          <div class="play-footer">
            ${badgeHtml}
            ${play.statYardage !== 0 ? `<span class="yard-stat">${play.statYardage > 0 ? '+' : ''}${play.statYardage} yds</span>` : ''}
          </div>
        </article>
      `;
          })
          .join('');
      }

      // Polling loop
      function startPolling() {
        fetchLivePlays();
        timerInterval = setInterval(() => {
          // Skip ticking/fetching while the tab is in the background
          if (document.hidden) {
            return;
          }
          countdown--;
          document.getElementById('poll-timer').innerText = `Next: ${countdown}s`;
          if (countdown <= 0) {
            fetchLivePlays();
          }
        }, 1000);
      }

      // Pause updates when the tab isn't visible, resync immediately when it becomes active again
      document.addEventListener('visibilitychange', () => {
        const statusText = document.getElementById('engine-status');
        if (document.hidden) {
          statusText.innerText = 'Paused (tab inactive)';
        } else {
          fetchLivePlays();
        }
      });

      startPolling();
    </script>
  </body>
</html>
